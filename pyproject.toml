[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[project]
name = "webull-auto-trading"
version = "0.1.0"
description = "Python foundation for InsightSentry-driven Webull auto trading"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
webull = ["webull-openapi-python-sdk"]
sanity = [
  "websockets>=15,<17",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]

[project.scripts]
webull-auto-trading = "webull_auto_trading.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webull_auto_trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: opt-in external integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
