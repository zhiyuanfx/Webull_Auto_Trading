id: example_momentum
version: 0.1.0
entrypoint: strategy:Strategy
name:
  en: Example Momentum
  zh_cn: 动量策略示例
description:
  en: Safe-by-default reference plugin demonstrating schedules and strategy-owned orders.
  zh_cn: 默认不交易的参考插件，演示交易时段和策略自主管理订单。
assets:
  - EQUITY
  - FUTURES
required_events:
  - quote
parameters:
  type: object
  properties:
    enabled:
      type: boolean
      default: false
    quantity:
      type: string
      default: "1"

